            </div>`).join('');
          const check = _pExec.check;
          resultEl.innerHTML = `
            <div class="ai-result-block ${pass ? 'pass' : 'fail'}">
              <div class="ai-verdict">
                <i class="fas ${pass ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
                ${pass ? '合格' : '不合格'}
              </div>
              <div class="ai-score">スコア: <strong>${judgment.score ?? '-'}</strong> / 100</div>
              <div class="ai-comment">${judgment.comment || ''}</div>
              ${detailRows ? `<div class="ai-details">${detailRows}</div>` : ''}
            </div>
            ${!pass && check.linkedVideoUrl ? `
              <div style="margin-top:16px;padding:14px 16px;
                          background:var(--warning-light);
                          border:1px solid #FDE68A;
                          border-radius:var(--radius-md);">
                <div style="font-size:13px;font-weight:700;
                            color:var(--warning);margin-bottom:8px;">
                  <i class="fas fa-video"></i> 関連マニュアルを確認してください

                  youtubeUrl:'${check.linkedVideoUrl}',

                  <i class="fas fa-play"></i> マニュアルを見る
                </button>
              </div>` : ''}
            `;
        }
        const submitBtn = document.getElementById('pcheck-submit-btn');
        if (submitBtn) submitBtn.disabled = false;
        showToast('AI判定が完了しました', 'success');
      } catch (err) {
        console.error('runPCheckAI error:', err);
        showToast('AI判定に失敗しました。そのまま提出できます。', 'warning');
        if (resultEl) resultEl.innerHTML = `
          <div style="background:var(--warning-light);border:1px solid #FDE68A;
                      border-radius:var(--radius-md);padding:12px 16px;
                      font-size:13px;color:var(--warning);">
            <i class="fas fa-exclamation-triangle"></i>
            AI判定に失敗しました。写真はアップロード済みなので提出できます。
          </div>`;
        const submitBtn = document.getElementById('pcheck-submit-btn');
        if (submitBtn) submitBtn.disabled = false;
      }
    }

            </div>
          </div>

          ${r.imageUrl ? `
            <div style="margin-bottom:16px;">
              <div style="font-size:12px;font-weight:600;color:var(--text-muted);
                          text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">

    async function _loadCleaningCheckList(ctx, yearMonth) {
      const el = document.getElementById('ccheck-list');
      if (!el) return;
      el.innerHTML = `
        <div style="text-align:center;padding:40px;color:var(--text-muted);">
          <div class="spinner" style="width:28px;height:28px;margin:0 auto 10px;"></div>
          <p style="font-size:14px;">読み込み中...</p>
        </div>`;
      try {
        const u = state.userData;
        const snap = await getDocs(
          query(collection(db, COLLECTIONS.cleaningChecks), where('companyId', '==', u.companyId))
        );
        const filteredChecks = snap.docs.filter(d => {
          const data = d.data();
          if (!(data.targetStoreIds || []).includes(u.storeId)) return false;
          const ym = data.yearMonth;
          return ym ? ym === yearMonth : true;
        });
        if (!filteredChecks.length) {
          el.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon"><i class="fas fa-broom"></i></div>
              <h3>${ymToLabel(yearMonth)}の清掃チェックはありません</h3>
              <p>本部が清掃チェックを設定するとここに表示されます</p>
            </div>`;
          return;
        }
        const now = new Date();
        const resSnap = await getDocs(
          query(collection(db, COLLECTIONS.cleaningCheckResults), where('companyId', '==', u.companyId))
        );
        const submittedIds = new Set(
          resSnap.docs
            .filter(d => {
              const r = d.data();
              if (r.storeId !== u.storeId) return false;
              const ts = r.submittedAt?.toDate
                ? r.submittedAt.toDate()
                : new Date((r.submittedAt?.seconds || 0) * 1000);
              const ym = `${ts.getFullYear()}-${String(ts.getMonth()+1).padStart(2,'0')}`;
              return ym === yearMonth;
            })
            .map(d => d.data().checkId)
        );
        const isCurrentMonth = yearMonth === currentYearMonth();
        el.innerHTML = filteredChecks.map(d => {
          const c = d.data();
          const done = submittedIds.has(d.id);
          const today = now.getDate();
          const overdue = isCurrentMonth && !done && c.scheduledDay && today > c.scheduledDay;
          return `
            <div class="check-exec-card ${done ? 'done' : overdue ? 'overdue' : ''}">
              <div class="check-exec-icon">
                <i class="fas ${done ? 'fa-circle-check' : 'fa-broom'}"></i>
              </div>
              <div class="check-exec-body">
                <div style="font-weight:600;font-size:15px;">${c.title || 'チェック'}</div>
                <div style="font-size:13px;color:var(--text-muted);margin-top:2px;">
                  ${(c.items || []).length}項目 / 毎月${c.scheduledDay || '-'}日
                  ${done
                    ? '<span style="color:var(--success);margin-left:8px;"><i class="fas fa-check"></i> 提出済み</span>'
                    : overdue
                      ? '<span style="color:var(--danger);margin-left:8px;">期限超過</span>'
                      : '<span style="color:var(--warning);margin-left:8px;">未提出</span>'
                  }
                </div>
              </div>
              ${isCurrentMonth && !done
                ? `<button class="btn btn-primary btn-sm"
                           onclick="startCleanCheckExec('${d.id}','${ctx}')">
                     <i class="fas fa-broom"></i> 実施
                   </button>`
                : done
                  ? `<span style="font-size:12px;color:var(--success);font-weight:600;">完了</span>`
                  : ''
              }
            </div>`;
        }).join('');
      } catch (err) {
        console.error('renderCleaningCheckList error:', err);
        showToast('清掃チェックの読み込みに失敗しました', 'error');
      }
    }
    window.renderCleaningCheckList = renderCleaningCheckList;

          .filter(d => d.data().storeId === u.storeId)

          resolved:    { label: '解決済み', cls: 'resolved'    },
        };
        el.innerHTML = sortedDocs.map(d => {
          const r  = d.data();

        const reader = new FileReader();

          _rMedia.push({ file, preview: reader.result });
          renderRepairMediaPreview();
        };
        reader.readAsDataURL(file);
      }
      input.value = '';

    async function renderStaffCheck(body) {
      const ym = currentYearMonth();
      body.innerHTML = `
        <div style="padding:20px;">
          <h2 style="font-size:17px;font-weight:700;margin-bottom:4px;">今月のやること</h2>
          <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">

          </p>
          <div id="staff-check-alert"></div>
          <div class="tab-switch" style="margin-bottom:20px;">
            <button class="tab-switch-btn active" id="staff-check-tab-product"
                    onclick="switchStaffCheckTab('product')">
              商品チェック
            </button>
            <button class="tab-switch-btn" id="staff-check-tab-clean"
                    onclick="switchStaffCheckTab('clean')">
              清掃チェック
            </button>
          </div>
          <div id="staff-check-content"></div>
        </div>
      `;
      // Check for pending items and show alert banner
      try {
        const u = state.userData;
        const snap = await getDocs(
          query(collection(db, COLLECTIONS.productChecks), where('companyId', '==', u.companyId))
        );
        const checks = snap.docs.filter(d => {
          const data = d.data();
          if (!(data.targetStoreIds || []).includes(u.storeId)) return false;
          const checkYm = data.yearMonth;
          return checkYm ? checkYm === ym : true;
        });
        if (checks.length > 0) {
          const resSnap = await getDocs(
            query(collection(db, COLLECTIONS.productCheckResults), where('companyId', '==', u.companyId))
          );
          const submittedIds = new Set(
            resSnap.docs
              .filter(d => {
                const r = d.data();
                if (r.storeId !== u.storeId) return false;
                const ts = r.submittedAt?.toDate
                  ? r.submittedAt.toDate()
                  : new Date((r.submittedAt?.seconds || 0) * 1000);
                const rYm = `${ts.getFullYear()}-${String(ts.getMonth()+1).padStart(2,'0')}`;
                return rYm === ym;
              })
              .map(d => d.data().checkId)
          );
          const pendingCount = checks.filter(d => !submittedIds.has(d.id)).length;
          const alertEl = document.getElementById('staff-check-alert');
          if (alertEl && pendingCount > 0) {
            alertEl.innerHTML = `
              <div style="background:var(--danger-light);border:1px solid #FCA5A5;
                          border-radius:var(--radius-md);padding:12px 16px;
                          margin-bottom:16px;display:flex;align-items:center;gap:10px;">
                <i class="fas fa-exclamation-circle"
                   style="color:var(--danger);font-size:16px;flex-shrink:0;"></i>
                <span style="font-size:13px;font-weight:700;color:var(--danger);">
                  未実施のチェックが${pendingCount}件あります。今月中に実施してください。
                </span>
              </div>`;
          }
        }
      } catch (err) {
        console.error('renderStaffCheck alert error:', err);
      }
      renderProductCheckList(document.getElementById('staff-check-content'), 'staff');
    }

    function switchStaffCheckTab(tab) {
      const productBtn = document.getElementById('staff-check-tab-product');
      const cleanBtn   = document.getElementById('staff-check-tab-clean');
      const contentEl  = document.getElementById('staff-check-content');
      if (!contentEl) return;
      if (tab === 'product') {
        if (productBtn) productBtn.classList.add('active');
        if (cleanBtn)   cleanBtn.classList.remove('active');
        renderProductCheckList(contentEl, 'staff');
      } else {
        if (productBtn) productBtn.classList.remove('active');
        if (cleanBtn)   cleanBtn.classList.add('active');
        renderCleaningCheckList(contentEl, 'staff');
      }
    }

    async function loadStaffRepairHistory() {
      const el = document.getElementById('staff-repair-list');
      if (!el) return;
      try {
        const u = state.userData;
        const snap = await getDocs(
          query(collection(db, COLLECTIONS.repairReports), where('companyId', '==', u.companyId))
        );
        const sortedDocs = [...snap.docs]
          .filter(d => d.data().storeId === u.storeId)
          .sort((a, b) => (b.data().createdAt?.seconds || 0) - (a.data().createdAt?.seconds || 0));
        if (!sortedDocs.length) {
          el.innerHTML = `
            <div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">
              まだ報告はありません
            </div>`;
          return;
        }
        const statusMeta = {
          pending:     { label: '対応待ち', cls: 'pending'     },
          in_progress: { label: '対応中',   cls: 'in_progress' },
          resolved:    { label: '解決済み', cls: 'resolved'    },
        };
        el.innerHTML = sortedDocs.map(d => {
          const r  = d.data();
          const st = statusMeta[r.status] || statusMeta.pending;
          const ts = r.createdAt?.toDate
            ? r.createdAt.toDate().toLocaleString('ja-JP')
            : '日時不明';
          const thumbs = (r.mediaUrls || [])
            .filter(mu => /\.(jpe?g|png|gif|webp)/i.test(mu))
            .map(mu => `<img src="${mu}" class="repair-thumb" alt="添付" onclick="openImageViewer('${mu}')">`)
            .join('');
          return `
            <div class="repair-card">
              <div class="repair-card-head">
                <span class="repair-category">${r.category || 'その他'}</span>
                <span class="repair-status-badge ${st.cls}">${st.label}</span>
              </div>
              <p class="repair-desc">${r.description || ''}</p>
              ${thumbs ? `<div class="repair-thumbs">${thumbs}</div>` : ''}
              <div class="repair-meta"><span><i class="fas fa-clock"></i> ${ts}</span></div>
            </div>`;
        }).join('');
      } catch (err) {
        console.error('loadStaffRepairHistory error:', err);
        showToast('履歴の読み込みに失敗しました', 'error');
      }
    }
    window.loadStaffRepairHistory = loadStaffRepairHistory;

    async function addStaffRepairMedia(input) {
      const files = Array.from(input.files);
      if (!files.length) return;
      for (const file of files) {
        const reader = new FileReader();
        reader.onloadend = () => {
          _rMedia.push({ file, preview: reader.result });
          renderStaffRepairMediaPreview();
        };
        reader.readAsDataURL(file);
      }
      input.value = '';
    }
    window.addStaffRepairMedia = addStaffRepairMedia;

    async function processHQSetup(firebaseUser, setupData) {

          storeName: `${setupData.companyName}本店`,

            collection(db, 'videos'),
            where('companyId', '==', u.companyId)
          )),
        ]);

        const monthStartMs = monthStart.getTime();
        const totalStores    = storesSnap.size;
        const results        = resultsSnap.docs
          .map(d => d.data())
          .filter(r => {
            const ts = r.submittedAt?.toDate
              ? r.submittedAt.toDate().getTime()
              : (r.submittedAt?.seconds || 0) * 1000;
            return ts >= monthStartMs;
          });

          r.result === 'pass' || r.judgment?.result === 'pass'

        const notSubmitted   = Math.max(0, totalStores - submittedCount);
        const rate           = totalStores > 0
          ? Math.round(submittedCount / totalStores * 100) : 0;
        const pendingRepairDocs = repairsSnap.docs.filter(d => d.data().status === 'pending');
        const pendingRepairs = pendingRepairDocs.length;

              </div>
              <div class="kpi-value" style="color:var(--danger);">${notSubmitted}</div>
              <div class="kpi-sub">チェック未提出の店舗</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">
                <i class="fas fa-wrench" style="color:var(--warning)"></i>
                未対応の修繕報告
              </div>
              <div class="kpi-value" style="color:var(--warning);">${pendingRepairs}</div>

                  <div class="repair-meta">
                    <span><i class="fas fa-clock"></i> ${ts}</span>

        </button>`;
      try {
        const u = state.userData;
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const [pChecksSnap, pResultsSnap,
               cChecksSnap, cResultsSnap, repairsSnap] = await Promise.all([
          getDocs(query(
            collection(db, COLLECTIONS.productChecks),
            where('companyId', '==', u.companyId)
          )),
          getDocs(query(
            collection(db, COLLECTIONS.productCheckResults),
            where('companyId', '==', u.companyId)
          )),
          getDocs(query(
            collection(db, COLLECTIONS.cleaningChecks),
            where('companyId', '==', u.companyId)
          )),
          getDocs(query(
            collection(db, COLLECTIONS.cleaningCheckResults),
            where('companyId', '==', u.companyId)
          )),
          getDocs(query(
            collection(db, COLLECTIONS.repairReports),
            where('companyId', '==', u.companyId)
          )),
        ]);

        const monthStartMs = monthStart.getTime();
        const pChecks  = pChecksSnap.docs.filter(d =>
          (d.data().targetStoreIds || []).includes(u.storeId)
        );
        const pResults = pResultsSnap.docs.filter(d => {
          const r = d.data();
          if (r.storeId !== u.storeId) return false;
          const ts = r.submittedAt?.toDate
            ? r.submittedAt.toDate().getTime()
            : (r.submittedAt?.seconds || 0) * 1000;
          return ts >= monthStartMs;
        });
        const cChecks  = cChecksSnap.docs.filter(d =>
          (d.data().targetStoreIds || []).includes(u.storeId)
        );
        const cResults = cResultsSnap.docs.filter(d => {
          const r = d.data();
          if (r.storeId !== u.storeId) return false;
          const ts = r.submittedAt?.toDate
            ? r.submittedAt.toDate().getTime()
            : (r.submittedAt?.seconds || 0) * 1000;
          return ts >= monthStartMs;
        });
        const repairs  = repairsSnap.docs.filter(d => {
          const r = d.data();
          return r.storeId === u.storeId && r.status === 'pending';
        });

        const today = now.getDate();
        const totalP     = pChecks.length;
        const submittedP = pResults.length;
        const totalC     = cChecks.length;
        const submittedC = cResults.length;
        const pendingRep = repairs.length;

        const overdueP = pChecks.filter(d => {
          const c = d.data();
          return !pResults.some(r => r.data().checkId === d.id)
            && c.dayOfMonth && today > c.dayOfMonth;
        }).length;
        const overdueC = cChecks.filter(d => {
          const c = d.data();
          return !cResults.some(r => r.data().checkId === d.id)
            && c.dayOfMonth && today > c.dayOfMonth;
        }).length;

        const pDone  = totalP > 0 && submittedP >= totalP;
        const cDone  = totalC > 0 && submittedC >= totalC;
        const pState = pDone ? 'success' : overdueP > 0 ? 'danger' : 'warning';
        const cState = cDone ? 'success' : overdueC > 0 ? 'danger' : 'warning';
        const pBadge = pDone ? 'badge-success' : overdueP > 0 ? 'badge-danger' : 'badge-warning';
        const cBadge = cDone ? 'badge-success' : overdueC > 0 ? 'badge-danger' : 'badge-warning';
        const pText  = pDone ? '完了' : overdueP > 0
          ? `${overdueP}件期限超過` : `${submittedP}/${totalP}件完了`;
        const cText  = cDone ? '完了' : overdueC > 0
          ? `${overdueC}件期限超過` : `${submittedC}/${totalC}件完了`;

        const el = document.getElementById('mgr-dash-status');
        if (el) {
          el.innerHTML = `
            <div class="status-card">
              <div class="status-icon ${pState}"><i class="fas fa-camera"></i></div>
              <div class="status-body">
                <h4>商品チェック</h4>
                <p>今月の実施状況</p>
              </div>
              <span class="status-badge ${pBadge}">${pText}</span>
            </div>
            <div class="status-card">
              <div class="status-icon ${cState}"><i class="fas fa-broom"></i></div>
              <div class="status-body">
                <h4>清掃チェック</h4>
                <p>今月の実施状況</p>
              </div>
              <span class="status-badge ${cBadge}">${cText}</span>
            </div>
            <div class="status-card">
              <div class="status-icon ${pendingRep > 0 ? 'warning' : 'success'}">
                <i class="fas fa-wrench"></i>
              </div>
              <div class="status-body">
                <h4>未対応の修繕報告</h4>
                <p>本部への報告</p>
              </div>
              ${pendingRep > 0
                ? `<span class="status-badge badge-warning">${pendingRep}件</span>`
                : `<span class="status-badge badge-success">なし</span>`
              }
            </div>`;
        }
      } catch (err) {
        console.error('renderMgrDashboard error:', err);
        showToast('ダッシュボードの読み込みに失敗しました', 'error');
      }
    }

    /* ============================================================
       Staff: MyPage (実装)
       ============================================================ */
    async function renderStaffMyPage(body) {
      const u = state.userData;
      const avatarHTML = u.photoURL
        ? `<img src="${u.photoURL}" class="mypage-avatar-img" alt="avatar">`
        : `<div class="mypage-avatar-letter"><i class="fas fa-user"></i></div>`;

      body.innerHTML = `
        <div class="mypage-profile">
          ${avatarHTML}
          <div class="mypage-name">${u.name || '名前未設定'}</div>
          <div class="mypage-email">${u.email}</div>
          <div class="mypage-store-chip">
            <i class="fas fa-store"></i> ${u.storeName || '店舗未設定'}
          </div>
        </div>
        <div style="padding:0 16px 16px;">
          <div class="section-row" style="margin-bottom:12px;">
            <span class="section-row-title" style="font-size:14px;">
              今月のチェック状況
            </span>
          </div>
          <div id="mypage-check-status" style="margin-bottom:24px;">
            <div style="text-align:center;padding:20px;color:var(--text-muted);">
              <div class="spinner"
                   style="width:20px;height:20px;margin:0 auto 8px;"></div>
            </div>
          </div>
          <div class="section-row" style="margin-bottom:12px;">
            <span class="section-row-title" style="font-size:14px;">
              いいねした動画
            </span>
          </div>
          <div id="mypage-liked-videos" style="margin-bottom:24px;">
            <div style="text-align:center;padding:20px;color:var(--text-muted);">
              <div class="spinner"
                   style="width:20px;height:20px;margin:0 auto 8px;"></div>
            </div>
          </div>
        </div>
        <div class="mypage-menu">
          <button class="menu-row" onclick="handleLogout()">
            <div class="menu-row-icon danger-bg">
              <i class="fas fa-sign-out-alt"></i>
            </div>
            <span style="color:var(--danger);">ログアウト</span>
            <i class="fas fa-chevron-right menu-row-chevron"></i>
          </button>
        </div>`;

      // Check status
      try {
        const now = new Date();
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const monthStartMs = monthStart.getTime();
        const [pResSnap, cResSnap] = await Promise.all([
          getDocs(query(
            collection(db, COLLECTIONS.productCheckResults),
            where('submittedBy', '==', u.uid)
          )),
          getDocs(query(
            collection(db, COLLECTIONS.cleaningCheckResults),
            where('submittedBy', '==', u.uid)
          )),
        ]);
        const pCount = pResSnap.docs.filter(d => {
          const ts = d.data().submittedAt?.toDate
            ? d.data().submittedAt.toDate().getTime()
            : (d.data().submittedAt?.seconds || 0) * 1000;
          return ts >= monthStartMs;
        }).length;
        const cCount = cResSnap.docs.filter(d => {
          const ts = d.data().submittedAt?.toDate
            ? d.data().submittedAt.toDate().getTime()
            : (d.data().submittedAt?.seconds || 0) * 1000;
          return ts >= monthStartMs;
        }).length;
        const checkEl = document.getElementById('mypage-check-status');
        if (checkEl) {
          checkEl.innerHTML = `
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
              <div style="flex:1;min-width:120px;background:var(--surface);
                          border:1px solid var(--border);border-radius:var(--radius-md);
                          padding:14px;text-align:center;">
                <div style="font-size:24px;font-weight:700;color:var(--primary);">
                  ${pCount}
                </div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">
                  商品チェック
                </div>
              </div>
              <div style="flex:1;min-width:120px;background:var(--surface);
                          border:1px solid var(--border);border-radius:var(--radius-md);
                          padding:14px;text-align:center;">
                <div style="font-size:24px;font-weight:700;color:var(--success);">
                  ${cCount}
                </div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">
                  清掃チェック
                </div>
              </div>
            </div>`;
        }
      } catch (err) {
        console.error('renderStaffMyPage check error:', err);
      }

      // Liked videos
      try {
        const likesSnap = await getDocs(
          query(collection(db, 'userLikes'), where('userId', '==', u.uid))
        );
        const activeLikes = likesSnap.docs.filter(d => d.data().active === true);
        const likedEl = document.getElementById('mypage-liked-videos');
        if (!likedEl) return;
        if (!activeLikes.length) {
          likedEl.innerHTML = `
            <div style="text-align:center;padding:20px;color:var(--text-muted);">
              <i class="fas fa-heart"
                 style="font-size:22px;margin-bottom:8px;display:block;"></i>
              <p style="font-size:13px;">まだいいねした動画はありません</p>
            </div>`;
          return;
        }
        const videoIds = activeLikes.map(d => d.data().videoId);
        const videoDocs = await Promise.all(
          videoIds.slice(0, 10).map(id => getDoc(doc(db, 'videos', id)))
        );
        const videos = videoDocs
          .filter(d => d.exists())
          .map(d => ({ id: d.id, ...d.data() }));
        if (!videos.length) {
          likedEl.innerHTML = `
            <div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">
              まだいいねした動画はありません
            </div>`;
          return;
        }
        _feedState.likedIds = new Set(videoIds);
        _feedState.videos   = videos;
        likedEl.innerHTML   = `<div class="video-grid">${videos.map(v => videoCardHTML(v)).join('')}</div>`;
      } catch (err) {
        console.error('renderStaffMyPage likes error:', err);
      }
    }

    /* ============================================================
       Shared Helpers
       ============================================================ */

    /* Build avatar HTML (img or letter fallback) */
    function avatarEl(user) {
      if (user?.photoURL) {
        return `<img src="${user.photoURL}" class="avatar-img" alt="avatar">`;
      }
      const letter = (user?.name || user?.email || 'U')[0].toUpperCase();
      return `<div class="avatar-letter">${letter}</div>`;
    }

    /* Generic placeholder for sidebar pages not yet implemented */
    function placeholderHTML(menuList, page) {
      const item = menuList.find(m => m.key === page);
      return `
        <div class="placeholder">
          <div class="ph-icon">
            <i class="fas ${item?.icon || 'fa-circle'}"></i>
          </div>
          <h3>${item?.label || page}</h3>
          <p>この画面は次のステップで実装します</p>
        </div>
      `;
    }

    /* ============================================================
       Main Render Dispatcher
       ============================================================ */
    function renderApp() {
      if (state.loading) { renderLoading(); return; }

      if (!state.user) {
        const token = getInviteParam();
        token ? renderInvitePage(token) : renderLP();
        return;
      }

      if (!state.userData) { renderAccessDenied(); return; }

      switch (state.userData.role) {
        case 'headquarters': renderHQ();      break;
        case 'manager':      renderManager(); break;
        case 'staff':        renderStaff();   break;
        default:             renderAccessDenied();
      }
    }

    /* ============================================================
       Auth State Observer (entry point)
       ============================================================ */
    onAuthStateChanged(auth, async firebaseUser => {
      if (firebaseUser) {
        state.user    = firebaseUser;
        state.loading = true;
        renderLoading();

        state.userData = await loadUserData(firebaseUser);
        state.loading  = false;
        state.page     = null; // Reset to default page on (re)login
        renderApp();
      } else {
        state.user     = null;
        state.userData = null;
        state.loading  = false;
        renderApp();
      }
    });

    /* Show loading spinner until auth state is determined */
    renderLoading();
  </script>
</body>
</html>
